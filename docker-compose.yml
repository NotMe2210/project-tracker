# Start:  TRACKER_PASSWORD='dein-langes-passwort' docker compose up -d
# Danach: http://SERVER:8080 (für den Zugriff von unterwegs HTTPS davorschalten, siehe README)
services:
  tracker:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      TRACKER_PASSWORD: ${TRACKER_PASSWORD:?Bitte TRACKER_PASSWORD setzen}
      # MySQL/MariaDB statt SQLite (dazu unten den Dienst „db“ einkommentieren):
      # TRACKER_DB_DSN: mysql:host=db;dbname=projekttracker;charset=utf8mb4
      # TRACKER_DB_USER: tracker
      # TRACKER_DB_PASS: ${TRACKER_DB_PASS}
    volumes:
      - tracker-data:/var/www/html/data

  # db:
  #   image: mariadb:11
  #   restart: unless-stopped
  #   environment:
  #     MARIADB_DATABASE: projekttracker
  #     MARIADB_USER: tracker
  #     MARIADB_PASSWORD: ${TRACKER_DB_PASS}
  #     MARIADB_RANDOM_ROOT_PASSWORD: "1"
  #   volumes:
  #     - db-data:/var/lib/mysql

volumes:
  tracker-data:
  # db-data:
