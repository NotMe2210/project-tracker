<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projekttracker</title>
  <meta name="description" content="Persönlicher Projekttracker für Zeit, Investitionen, Meilensteine und Aufgaben – mit Motivationshilfen.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">🚀 <span>Projekttracker</span></a>
    <nav class="nav">
      <a href="#/" data-nav="dashboard">Übersicht</a>
      <a href="#/projekte" data-nav="projekte">Projekte</a>
      <a href="#/einstellungen" data-nav="einstellungen">Einstellungen</a>
    </nav>
    <div class="topbar-actions">
      <div id="timer-indicator" class="timer-indicator" hidden></div>
      <button class="btn primary small" data-action="addTime">+ Zeit</button>
    </div>
  </header>

  <main id="app" class="container"></main>

  <dialog id="modal"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
