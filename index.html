<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Protrac by R3DO</title>
  <meta name="description" content="Persönlicher Projekttracker für Zeit, Investitionen, Meilensteine und Aufgaben – mit Motivationshilfen.">
  <link rel="icon" href="favicon.ico?v=2026.11.22-12" sizes="any">
  <link rel="shortcut icon" href="favicon.ico?v=2026.11.22-12">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2026.11.22-12">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png?v=2026.11.22-12">
  <link rel="apple-touch-icon" href="icon-180.png?v=2026.11.22-12">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Protrac">
  <meta name="theme-color" content="#4f46e5">
  <script>
    // Eingeklappte Seitenleiste sofort anwenden (vermeidet Flackern beim Laden)
    try { if (localStorage.getItem('projekttracker.ui.sidebar') === 'collapsed') document.documentElement.classList.add('side-collapsed'); } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css?v=2026.11.22-12">
</head>
<body>
  <header class="topbar">
    <div class="side-head">
      <a class="brand" href="#/" title="Protrac by R3DO" aria-label="Protrac by R3DO"><img class="brand-mark" src="logo.png" alt="" aria-hidden="true"><span class="brand-text"><span class="brand-name">Protrac</span><span class="brand-by">by R3DO</span></span></a>
      <button id="side-toggle" class="side-toggle" type="button" data-action="toggleSidebar" title="Seitenleiste einklappen" aria-label="Seitenleiste einklappen">«</button>
    </div>
    <span id="compact-title" class="compact-title" aria-hidden="true"></span>
    <nav class="nav">
      <a href="#/" data-nav="dashboard" title="Übersicht" data-i18n-title="Übersicht"><span class="ico">📊</span><span class="lbl" data-i18n="Übersicht">Übersicht</span></a>
      <a href="#/projekte" data-nav="projekte" title="Projekte" data-i18n-title="Projekte"><span class="ico">🗂️</span><span class="lbl" data-i18n="Projekte">Projekte</span></a>
      <a href="#/einstellungen" data-nav="einstellungen" title="Einstellungen" data-i18n-title="Einstellungen"><span class="ico">⚙️</span><span class="lbl" data-i18n="Einstellungen">Einstellungen</span></a>
    </nav>
    <button type="button" class="btn ghost cmd-btn" data-action="openPalette" title="Befehlspalette">🔎 <span data-i18n="Suchen">Suchen</span> <kbd>⌘K</kbd></button>
    <button type="button" class="btn ghost cmd-btn quick-cmd" data-action="quickAdd" title="Schnelleingabe" data-i18n-title="Schnelleingabe">⚡ <span data-i18n="Schnelleingabe">Schnelleingabe</span> <kbd>N</kbd></button>
    <div class="topbar-actions">
      <div id="timer-indicator" class="timer-indicator" hidden></div>
      <button type="button" class="btn small quick-btn" data-action="quickAdd" title="Schnelleingabe" data-i18n-title="Schnelleingabe" aria-label="Schnelleingabe" data-i18n-aria="Schnelleingabe">⚡</button>
      <button id="backup-btn" class="btn small backup-btn" data-action="exportData">💾 <span>Sichern</span></button>
      <button class="btn primary small add-time" data-action="addTime" title="Zeit erfassen" data-i18n-title="Zeit erfassen">+ <span data-i18n="Zeit">Zeit</span></button>
    </div>
  </header>
  <div id="update-bar" class="backup-bar info" hidden></div>
  <div id="backup-bar" class="backup-bar" hidden></div>

  <main id="app" class="container"></main>

  <dialog id="modal"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="i18n.js?v=2026.11.22-12"></script>
  <script src="lang-en.js?v=2026.11.22-12"></script>
  <script src="app.js?v=2026.11.22-12"></script>
</body>
</html>
